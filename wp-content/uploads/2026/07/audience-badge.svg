<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80"><style> .badge{ transform-box:fill-box; transform-origin:center; animation:pop 2.2s ease-in-out infinite; } @keyframes pop{ 0%,40%{transform:scale(1);} 50%{transform:scale(1.1);} 60%,100%{transform:scale(1);} } .check{ stroke-dasharray:70; animation:draw 2.2s ease-in-out infinite; } @keyframes draw{ 0%{stroke-dashoffset:70;} 15%{stroke-dashoffset:70;} 45%{stroke-dashoffset:0;} 80%{stroke-dashoffset:0;} 100%{stroke-dashoffset:70;} } </style><g class="badge"><rect x="15" y="15" width="70" height="70" rx="16" fill="#ED1C24"></rect><path class="check" d="M28 52 L44 68 L74 34" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>