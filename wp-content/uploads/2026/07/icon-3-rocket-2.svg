<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120"><style> .rocket{ transform-box:fill-box; transform-origin:center; animation:hover 1.4s ease-in-out infinite; } @keyframes hover{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} } .flame{ transform-box:fill-box; transform-origin:bottom; animation:flicker .35s ease-in-out infinite alternate; } @keyframes flicker{ 0%{transform:scaleY(.85);} 100%{transform:scaleY(1.2);} } .exhaust{opacity:0; animation:exhaust 1.1s ease-in infinite;} .e1{animation-delay:0s;} .e2{animation-delay:.25s;} .e3{animation-delay:.5s;} @keyframes exhaust{ 0%{opacity:0; transform:translateY(0);} 30%{opacity:1;} 100%{opacity:0; transform:translateY(6px);} } </style><circle cx="50" cy="50" r="46" fill="none" stroke="#000" stroke-width="2"></circle><g class="rocket"><path d="M50 22 C57 31 59 42 59 51 L41 51 C41 42 43 31 50 22 Z" fill="#fff" stroke="#000" stroke-width="2.5"></path><circle cx="50" cy="37" r="4" fill="#ED1C24"></circle><path d="M41 45 L32 56 L41 53 Z" fill="#fff" stroke="#000" stroke-width="2"></path><path d="M59 45 L68 56 L59 53 Z" fill="#fff" stroke="#000" stroke-width="2"></path><rect x="45" y="48" width="10" height="4" fill="#ED1C24"></rect></g><path class="flame" d="M45 55 L50 68 L55 55 Z" fill="#ED1C24"></path><line class="exhaust e1" x1="46" y1="70" x2="46" y2="76" stroke="#000" stroke-width="2" stroke-linecap="round"></line><line class="exhaust e2" x1="50" y1="71" x2="50" y2="78" stroke="#ED1C24" stroke-width="2" stroke-linecap="round"></line><line class="exhaust e3" x1="54" y1="70" x2="54" y2="76" stroke="#000" stroke-width="2" stroke-linecap="round"></line></svg> 