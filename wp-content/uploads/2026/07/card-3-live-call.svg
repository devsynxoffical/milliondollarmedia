<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120"><style> .live-dot{ transform-box:fill-box; transform-origin:center; animation:blink 1.2s ease-in-out infinite; } @keyframes blink{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.3; transform:scale(.75);} } .bar{ transform-box:fill-box; transform-origin:bottom; animation:grow 1.8s ease-in-out infinite; } .b1{animation-delay:0s;} .b2{animation-delay:.15s;} .b3{animation-delay:.3s;} @keyframes grow{ 0%,100%{transform:scaleY(.65);} 50%{transform:scaleY(1);} } </style><circle cx="50" cy="50" r="46" fill="none" stroke="#000" stroke-width="2"></circle><path d="M32 46 a18 18 0 0 1 36 0" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"></path><rect x="27" y="44" width="9" height="15" rx="3" fill="#fff" stroke="#000" stroke-width="2.5"></rect><rect x="64" y="44" width="9" height="15" rx="3" fill="#fff" stroke="#000" stroke-width="2.5"></rect><path d="M68 59 q7 3 3 12" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"></path><circle cx="70" cy="71" r="2.4" fill="#ED1C24"></circle><circle class="live-dot" cx="50" cy="23" r="4" fill="#ED1C24"></circle><line x1="30" y1="82" x2="70" y2="82" stroke="#000" stroke-width="2.2"></line><rect class="bar b1" x="34" y="70" width="7" height="12" fill="#000"></rect><rect class="bar b2" x="46" y="64" width="7" height="18" fill="#ED1C24"></rect><rect class="bar b3" x="58" y="58" width="7" height="24" fill="#000"></rect></svg>