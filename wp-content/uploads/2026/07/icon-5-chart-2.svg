<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120"><style> .bar{ transform-box:fill-box; transform-origin:bottom; animation:grow 1.8s ease-in-out infinite; } .b1{animation-delay:0s;} .b2{animation-delay:.15s;} .b3{animation-delay:.3s;} .b4{animation-delay:.45s;} @keyframes grow{ 0%,100%{transform:scaleY(.7);} 50%{transform:scaleY(1);} } .dot{animation:travel 2.4s ease-in-out infinite;} @keyframes travel{ 0%{transform:translate(0,0); opacity:0;} 10%{opacity:1;} 45%{transform:translate(44px,-36px); opacity:1;} 55%{opacity:0;} 100%{transform:translate(44px,-36px); opacity:0;} } </style><circle cx="50" cy="50" r="46" fill="none" stroke="#000" stroke-width="2"></circle><line x1="28" y1="72" x2="76" y2="72" stroke="#000" stroke-width="2.5"></line><rect class="bar b1" x="32" y="58" width="8" height="14" fill="#000"></rect><rect class="bar b2" x="44" y="50" width="8" height="22" fill="#ED1C24"></rect><rect class="bar b3" x="56" y="42" width="8" height="30" fill="#000"></rect><rect class="bar b4" x="68" y="34" width="8" height="38" fill="#ED1C24"></rect><path d="M30 66 L48 46 L58 54 L74 30" fill="none" stroke="#ED1C24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M70 30 L74 30 L74 34 Z" fill="#ED1C24"></path><circle class="dot" cx="30" cy="66" r="3" fill="#000"></circle></svg> 