<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120"><style> .chk{animation:draw 3s ease-in-out infinite;} @keyframes draw{ 0%{stroke-dashoffset:1;} 15%{stroke-dashoffset:1;} 35%{stroke-dashoffset:0;} 80%{stroke-dashoffset:0;} 100%{stroke-dashoffset:1;} } .ripple{ transform-box:fill-box; transform-origin:center; animation:ripple 2.4s ease-out infinite; } @keyframes ripple{ 0%{opacity:.6; transform:scale(.9);} 100%{opacity:0; transform:scale(1.7);} } </style><circle cx="50" cy="50" r="46" fill="none" stroke="#000" stroke-width="2"></circle><rect x="24" y="34" width="50" height="34" rx="3" fill="#fff" stroke="#000" stroke-width="3"></rect><path d="M24 35 L49 55 L74 35" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round"></path><circle class="ripple" cx="70" cy="64" r="10" fill="none" stroke="#ED1C24" stroke-width="1.5"></circle><circle cx="70" cy="64" r="10" fill="#ED1C24" stroke="#fff" stroke-width="2"></circle><path class="chk" d="M65.5 64 L68.5 67.5 L75 59.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"></path></svg>