<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120"><style> .dial{ transform-box:fill-box; transform-origin:center; animation:spin 6s linear infinite; } @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} } .lock-badge{ transform-box:fill-box; transform-origin:center; animation:pulse 1.6s ease-in-out infinite; } @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} } </style><circle cx="50" cy="50" r="46" fill="none" stroke="#000" stroke-width="2"></circle><g class="dial"><circle cx="44" cy="42" r="14" fill="#fff" stroke="#000" stroke-width="3"></circle><line x1="44" y1="24" x2="44" y2="29" stroke="#000" stroke-width="2.2" transform="rotate(0 44 42)"></line><line x1="44" y1="24" x2="44" y2="29" stroke="#000" stroke-width="2.2" transform="rotate(45 44 42)"></line><line x1="44" y1="24" x2="44" y2="29" stroke="#000" stroke-width="2.2" transform="rotate(90 44 42)"></line><line x1="44" y1="24" x2="44" y2="29" stroke="#000" stroke-width="2.2" transform="rotate(135 44 42)"></line><line x1="44" y1="24" x2="44" y2="29" stroke="#000" stroke-width="2.2" transform="rotate(180 44 42)"></line><line x1="44" y1="24" x2="44" y2="29" stroke="#000" stroke-width="2.2" transform="rotate(225 44 42)"></line><line x1="44" y1="24" x2="44" y2="29" stroke="#000" stroke-width="2.2" transform="rotate(270 44 42)"></line><line x1="44" y1="24" x2="44" y2="29" stroke="#000" stroke-width="2.2" transform="rotate(315 44 42)"></line><circle cx="44" cy="42" r="2.5" fill="#ED1C24"></circle></g><g class="lock-badge"><path d="M66 65 a5 5 0 0 1 10 0" fill="none" stroke="#000" stroke-width="3"></path><rect x="64" y="65" width="16" height="13" rx="3" fill="#ED1C24" stroke="#000" stroke-width="2"></rect><circle cx="72" cy="71.5" r="1.8" fill="#fff"></circle></g></svg> 