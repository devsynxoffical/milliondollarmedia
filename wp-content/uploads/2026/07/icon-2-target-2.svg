<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120"><style> .glass{ transform-box:fill-box; transform-origin:center; animation:scan 4.5s ease-in-out infinite; } @keyframes scan{ 0%{transform:translate(0,0);} 25%{transform:translate(-16px,10px);} 50%{transform:translate(-6px,-16px);} 75%{transform:translate(10px,4px);} 100%{transform:translate(0,0);} } .ring{transform-box:fill-box; transform-origin:center;} .ring2{animation:pulse 2.4s ease-in-out infinite;} .ring3{animation:pulse 2.4s ease-in-out infinite .6s;} @keyframes pulse{ 0%,100%{opacity:.35; transform:scale(.9);} 50%{opacity:1; transform:scale(1);} } </style><circle cx="50" cy="50" r="46" fill="none" stroke="#000" stroke-width="2"></circle><circle class="ring ring1" cx="50" cy="50" r="10" fill="none" stroke="#000" stroke-width="2.5"></circle><circle class="ring ring2" cx="50" cy="50" r="18" fill="none" stroke="#ED1C24" stroke-width="2.5"></circle><circle class="ring ring3" cx="50" cy="50" r="26" fill="none" stroke="#000" stroke-width="2"></circle><circle cx="50" cy="50" r="3" fill="#ED1C24"></circle><g class="glass"><circle cx="63" cy="35" r="10" fill="#fff" stroke="#ED1C24" stroke-width="4"></circle><line x1="70" y1="42" x2="78" y2="50" stroke="#000" stroke-width="4" stroke-linecap="round"></line></g></svg> 