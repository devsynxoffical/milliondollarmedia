<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120"><style> .line{ transform-box:fill-box; transform-origin:center; animation:hl 2.4s ease-in-out infinite; } .l1{animation-delay:0s;} .l2{animation-delay:.3s;} .l3{animation-delay:.6s;} .l4{animation-delay:.9s;} @keyframes hl{ 0%,100%{opacity:.35;} 50%{opacity:1;} } .glass{ transform-box:fill-box; transform-origin:center; animation:scan 3s ease-in-out infinite; } @keyframes scan{ 0%{transform:translateY(0); opacity:0;} 15%{opacity:1;} 85%{opacity:1;} 100%{transform:translateY(24px); opacity:0;} } </style><circle cx="50" cy="50" r="46" fill="none" stroke="#000" stroke-width="2"></circle><rect x="30" y="22" width="34" height="46" rx="3" fill="#fff" stroke="#000" stroke-width="3"></rect><path d="M56 22 L64 22 L64 30 Z" fill="#ED1C24"></path><rect class="line l1" x="36" y="34" width="22" height="3" rx="1.5" fill="#000"></rect><rect class="line l2" x="36" y="42" width="22" height="3" rx="1.5" fill="#000"></rect><rect class="line l3" x="36" y="50" width="22" height="3" rx="1.5" fill="#000"></rect><rect class="line l4" x="36" y="58" width="14" height="3" rx="1.5" fill="#000"></rect><g class="glass"><circle cx="46" cy="34" r="9" fill="none" stroke="#ED1C24" stroke-width="3.5"></circle><line x1="52" y1="40" x2="58" y2="46" stroke="#ED1C24" stroke-width="3.5" stroke-linecap="round"></line></g></svg>